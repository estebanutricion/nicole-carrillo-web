<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--wine:#34475A;--magenta:#34475A;--gold:#D6C9E5;--cream:#F8F6F1;--ink:#34475A}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:36px 18px;background:radial-gradient(circle at 50% 0%,#C9E4EF 0%,#F8F6F1 58%);color:var(--ink);font-family:"DM Sans",sans-serif}
    main{width:min(100%,490px);text-align:center}
    .photo{width:164px;height:164px;margin:0 auto 22px;object-fit:cover;object-position:center 27%;border-radius:50%;border:5px solid #F8F6F1;box-shadow:0 0 0 2px var(--gold),0 12px 30px #641b3c26}
    .eyebrow{margin:0 0 8px;color:var(--magenta);font-size:12px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}
    h1{margin:0;color:var(--wine);font-family:"Playfair Display",serif;font-size:clamp(38px,8vw,52px);line-height:1.1}
    .message{max-width:410px;margin:18px auto 30px;font-size:18px;line-height:1.6}
    .button{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:16px;background:var(--wine);color:#F8F6F1;text-decoration:none;font-weight:700;transition:transform .2s,background .2s}
    .button:hover,.button:focus-visible{background:var(--magenta);transform:translateY(-2px)}
    .contact{margin-top:16px;padding:20px;display:flex;align-items:center;gap:16px;text-align:left;border:1px solid #D6C9E5;border-radius:18px;background:#F8F6F1;box-shadow:0 10px 30px #641b3c0d}
    .contact img{width:66px;height:66px;flex:none;object-fit:cover;object-position:center 27%;border-radius:50%}
    .contact-content{min-width:0;flex:1}
    .contact strong,.contact span{display:block}
    .contact strong{color:var(--wine);font-size:17px}
    .contact span{font-size:13px;color:#34475A}
    .contact a{display:inline-block;margin-top:9px;color:var(--magenta);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
    .contact a:focus-visible,.button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    @media(max-width:390px){.contact{padding:15px;gap:12px}.contact img{width:56px;height:56px}}
  </style>
</head>
<body>
  <main>
    <img class="photo" src="nicole-original.jpg" alt="Retrato de Nicole Carrillo" width="164" height="164">
    <p class="eyebrow">Estrategia · Negocios · Inteligencia artificial</p>

    <p class="message">Ideas claras. Negocios que funcionan.</p>

    <section class="contact" aria-label="Contacto por WhatsApp Business">
      <img src="nicole-original.jpg" alt="" width="66" height="66">
      <div class="contact-content">
        <strong>Nicole Carrillo</strong>
        <span>WhatsApp Business</span>
        <span>+1 (448) 238-3763</span>
        <a href="https://wa.me/14482383763?text=Hola%2C%20Nicole.%20Vi%20tu%20p%C3%A1gina%20y%20me%20interesa%20conocer%20m%C3%A1s%20sobre%20el%20Diagn%C3%B3stico%20Estrat%C3%A9gico%20de%20Negocio%20de%20%2497%20USD." target="_blank" rel="noopener noreferrer" aria-label="Escríbeme por WhatsApp Business">Escríbeme por WhatsApp →</a>
      </div>
    </section>
    <p><a href="https://www.instagram.com/nicoleresuelve/" target="_blank" rel="noopener noreferrer">Instagram · @nicoleresuelve ↗</a></p>
  </main>
</body>
</html>
